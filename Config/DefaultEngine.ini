; Mars Hello World - engine config (UE 5.8)

[/Script/EngineSettings.GameMapsSettings]
; No .umap ships in the repo: the engine's built-in Entry map is loaded and AMarsGameMode builds Mars at runtime.
; After running Content/Python/mars_setup.py you may switch both maps to /Game/Maps/MarsArena.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/MarsHelloWorld.MarsGameMode

[/Script/Engine.PhysicsSettings]
; Mars surface gravity 3.71 m/s^2 = -371 cm/s^2 (Earth default is -980)
DefaultGravityZ=-371.000000

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.SkyAtmosphere=True
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.VolumetricFog=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=4

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/MarsHelloWorld")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/MarsHelloWorld")

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=False

[Core.Log]
LogMars=Log
